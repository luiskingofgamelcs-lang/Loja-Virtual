services:
  - type: web
    name: vitrine-virtual-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: vitrine_virtual
      - key: JWT_SECRET
        generateValue: true
      - key: PLATFORM_SETUP_SECRET
        generateValue: true
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_SSL
        value: "false"
      - key: FRONTEND_URL
        value: https://luiskingofgamelcs-lang.github.io/Loja-Virtual
      - key: CORS_ORIGINS
        value: https://luiskingofgamelcs-lang.github.io
      - key: COOKIE_SECURE
        value: "true"
